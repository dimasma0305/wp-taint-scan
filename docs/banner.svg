<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" fill="none" role="img" aria-label="wp-taint-scan">
  <defs>
    <linearGradient id="b-g" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="b-text" x1="250" y1="80" x2="780" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8b8ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="258" rx="20" fill="url(#b-bg)" stroke="#2a3340"/>
  <!-- faint dotted grid accent -->
  <g fill="#7c5cff" opacity="0.10">
    <circle cx="40" cy="40" r="2"/><circle cx="80" cy="40" r="2"/><circle cx="120" cy="40" r="2"/>
    <circle cx="40" cy="80" r="2"/><circle cx="80" cy="80" r="2"/>
    <circle cx="860" cy="220" r="2"/><circle cx="820" cy="220" r="2"/><circle cx="860" cy="180" r="2"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(60,66) scale(2.0)">
    <path d="M32 3 L55 11 V30 C55 44.5 45.4 54.6 32 61 C18.6 54.6 9 44.5 9 30 V11 Z"
          fill="#0d1117" stroke="url(#b-g)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="28.5" cy="27.5" r="9.5" stroke="url(#b-g)" stroke-width="3"/>
    <line x1="35.3" y1="34.3" x2="44" y2="43" stroke="url(#b-g)" stroke-width="4" stroke-linecap="round"/>
    <path d="M25.5 23.5 L22 27.5 L25.5 31.5 M31.5 23.5 L35 27.5 L31.5 31.5"
          stroke="#e6edf3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="58" font-weight="700" fill="url(#b-text)">wp-taint-scan</text>
  <text x="234" y="168" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" fill="#8b98a9">WordPress plugin vulnerability scanner</text>
  <text x="234" y="200" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#7c5cff" font-weight="600">search&#160;&#160;·&#160;&#160;scan versions in parallel&#160;&#160;·&#160;&#160;diff findings&#160;&#160;·&#160;&#160;WordPress-aware taint analysis</text>
